name: NCG - firma SignPath (solo tras aprobacion)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  firmar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fuentes_lanzador_windows/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar autorizacion y configuracion de SignPath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "$name ausente: primero obtener aprobacion y configurar SignPath" }
          }
      - name: Preparar metadatos de Windows en Go (version 18.36.15.0)
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          $tool = Join-Path (go env GOPATH) 'bin/goversioninfo.exe'
          Push-Location fuentes_lanzador_windows
          & $tool -64 -ver-major=18 -ver-minor=36 -ver-patch=14 -ver-build=0 -product-ver-major=18 -product-ver-minor=36 -product-ver-patch=14 -product-ver-build=0 -file-version=18.36.15.0 -product-version=18.36.15.0 -description='NCG - Gabinete numismatico' -company='NCG' -product-name='NCG' -internal-name='NCG' -original-name='NCG_V18_36_15.exe' -o='resource.syso'
          if ($LASTEXITCODE -ne 0) { throw 'Fallo al generar recurso de version Windows' }
          Pop-Location
      - name: Compilar y validar codigo del lanzador
        shell: pwsh
        run: |
          Push-Location fuentes_lanzador_windows
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test fallo' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet fallo' }
          go build -trimpath -buildvcs=false -ldflags='-H=windowsgui -s -w' -o ../NCG_V18_36_15.exe .
          if ($LASTEXITCODE -ne 0) { throw 'go build fallo' }
          Pop-Location
          python scripts/verificar_pe.py NCG_V18_36_15.exe
          if ($LASTEXITCODE -ne 0) { throw 'El ejecutable Windows no es valido' }
          $v=(Get-Item '.\NCG_V18_36_15.exe').VersionInfo
          if ($v.ProductName -ne 'NCG' -or $v.ProductVersion -ne '18.36.15.0' -or $v.FileVersion -ne '18.36.15.0') {
            throw "Los metadatos Windows no coinciden: $($v.ProductName) $($v.ProductVersion) $($v.FileVersion)"
          }
      - name: Auditoria de NCG
        shell: pwsh
        run: |
          python tests/auditar.py
          if ($LASTEXITCODE -ne 0) { throw 'Auditoria funcional fallo' }
      - name: Comprobar derechos de todos los recursos antes de solicitar firma
        shell: pwsh
        run: |
          python scripts/verificar_licencias.py --release
          if ($LASTEXITCODE -ne 0) { throw 'Licencias pendientes: firma bloqueada hasta cerrar manifiesto' }
      - name: Subir ejecutable SIN firma a GitHub (origen verificable)
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: NCG-V18-36-14-unsigned
          path: NCG_V18_36_15.exe
          if-no-files-found: error
      - name: Solicitar firma autentica a SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Exigir Authenticode valido antes de distribuir
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path signed -Filter NCG_V18_36_15.exe -File -Recurse)
          if ($files.Count -ne 1) { throw "Se esperaba un unico exe firmado, encontrados: $($files.Count)" }
          $sig = Get-AuthenticodeSignature -FilePath $files[0].FullName
          if ($sig.Status -ne 'Valid') { throw "Firma no valida: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw 'Firmante inesperado. Revisar certificado.' }
          New-Item -ItemType Directory -Force -Path 'release/NCG_V18_36_15' | Out-Null
          Copy-Item -Path $files[0].FullName -Destination 'release/NCG_V18_36_15/NCG_V18_36_15.exe'
          Copy-Item -Path resources,ncg.version.json,neutralino.config.json -Destination 'release/NCG_V18_36_15' -Recurse
          @'
          NCG V18.36.15 — EDICION WINDOWS FIRMADA
          Ejecuta NCG_V18_36_15.exe. Incluye los archivos resources/ y bin/.
          Para verificar: clic derecho en el .exe -> Propiedades -> Firmas digitales.
          El firmante debe ser SignPath Foundation y la firma debe ser valida.
          Conservar respaldos de partida antes de instalar nuevas versiones.
          Guardados: %LOCALAPPDATA%\NCG\Guardados
          '@ | Set-Content -Path 'release/NCG_V18_36_15/LEEME_WINDOWS_FIRMADO.txt' -Encoding UTF8
          Compress-Archive -Path 'release/NCG_V18_36_15' -DestinationPath 'release/NCG_V18_36_15.zip' -CompressionLevel Optimal -Force
          $hash = (Get-FileHash 'release/NCG_V18_36_15.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NCG_V18_36_15.zip" | Set-Content -Path 'release/SHA256SUMS.txt' -Encoding ASCII
      - name: Entregar paquete solo si esta FIRMADO
        uses: actions/upload-artifact@v7
        with:
          name: NCG-V18-36-14-FIRMADO
          path: |
            release/NCG_V18_36_15.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
